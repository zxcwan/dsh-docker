name: build-push

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'   # 每天 02:00 UTC（北京 10:00）检查 dsh 新版本；留给 11:30 的插件检查足够余量
  workflow_dispatch:
    inputs:
      version:
        description: '手动指定 dsh 版本（如 0.2.2-rc.5）；留空则自动取最新'
        required: false
        default: ''

permissions:
  packages: write   # 推送 GHCR
  actions: read     # build-push-action 的 gha 缓存

# 定时任务与 push 分开成组：被延迟执行的定时构建不会取消刚推送触发的构建
concurrency:
  group: dsh-gateway-build-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 两个版本分开算：
      #   stable = 最新非 alpha（rc 或正式版）→ 打 :<version> 并更新 :latest
      #   newest = 最新（可能是 alpha）→ 只打 :<version>，不动 :latest
      # 排序用 scripts/dsh-versions.py（真 semver），不用 sort -V。
      - name: 计算要构建的版本
        id: check
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 "https://registry.npmjs.org/@deepseek-ai/dsh" -o /tmp/dsh-pack.json
          curl -fsS --max-time 30 "https://api.github.com/repos/deepseek-ai/deepseek-harness/releases?per_page=100" -o /tmp/dsh-releases.json
          python3 scripts/dsh-versions.py /tmp/dsh-pack.json /tmp/dsh-releases.json > /tmp/dsh-versions.txt
          NEWEST=$(sed -n 1p /tmp/dsh-versions.txt)
          STABLE=$(sed -n 2p /tmp/dsh-versions.txt)

          MANUAL="${{ github.event.inputs.version }}"
          if [ -n "$MANUAL" ]; then
            if ! jq -e --arg v "$MANUAL" '.versions[$v]' /tmp/dsh-pack.json >/dev/null; then
              echo "指定的 $MANUAL 不是已发布到 npm 的版本"; exit 1
            fi
            NEWEST="$MANUAL"
            STABLE="$MANUAL"
          fi

          ALPHA=""
          if [ -n "$NEWEST" ] && [ "$NEWEST" != "$STABLE" ]; then
            case "$NEWEST" in *alpha*) ALPHA="$NEWEST" ;; esac
          fi
          echo "newest=${NEWEST:-<none>} stable=${STABLE:-<none>} alpha=${ALPHA:-<none>}"

          BUILD_STABLE=true
          BUILD_ALPHA=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ -n "$STABLE" ] && docker manifest inspect "ghcr.io/${{ github.repository }}:$STABLE" >/dev/null 2>&1; then
              BUILD_STABLE=false
              echo "$STABLE 镜像已存在，跳过 stable 构建"
            fi
            if [ -n "$ALPHA" ] && docker manifest inspect "ghcr.io/${{ github.repository }}:$ALPHA" >/dev/null 2>&1; then
              BUILD_ALPHA=false
              echo "$ALPHA 镜像已存在，跳过 alpha 构建"
            fi
          fi
          [ -n "$STABLE" ] || BUILD_STABLE=false
          [ -n "$ALPHA" ] || BUILD_ALPHA=false
          if [ "$BUILD_STABLE" = false ] && [ "$BUILD_ALPHA" = false ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "stable=$STABLE"
            echo "alpha=$ALPHA"
            echo "build_stable=$BUILD_STABLE"
            echo "build_alpha=$BUILD_ALPHA"
          } >> "$GITHUB_OUTPUT"

      - name: 登录 GHCR
        if: steps.check.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 qemu（arm64 构建模拟）
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v3

      - name: 设置 buildx（docker-container driver，gha 缓存导出必需）
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      # alpha：只打版本号，不碰 latest（先构建，让 stable 成为最后发布的版本，
      # 这样 GitHub 包页面顶部的 Latest 会显示非 alpha 的版本）
      - name: 构建并推送 alpha（只打版本号）
        if: steps.check.outputs.skip != 'true' && steps.check.outputs.build_alpha == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.check.outputs.alpha }}
          labels: |
            org.opencontainers.image.title=dsh-docker
            org.opencontainers.image.description=DeepSeekRuntime (dsh) alpha build; not used by :latest.
            org.opencontainers.image.version=${{ steps.check.outputs.alpha }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=NOASSERTION
          build-args: |
            DSH_VERSION=${{ steps.check.outputs.alpha }}

      # stable：更新 latest（这是 compose 里用的标签）；放在最后构建，
      # 保证 GitHub 包页面的 Latest 标记落在非 alpha 版本上
      - name: 构建并推送 stable（更新 latest）
        if: steps.check.outputs.skip != 'true' && steps.check.outputs.build_stable == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.check.outputs.stable }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.title=dsh-docker
            org.opencontainers.image.description=DeepSeekRuntime (dsh) web image with the auth gateway. :latest tracks the newest non-alpha dsh release.
            org.opencontainers.image.version=${{ steps.check.outputs.stable }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=NOASSERTION
          build-args: |
            DSH_VERSION=${{ steps.check.outputs.stable }}
